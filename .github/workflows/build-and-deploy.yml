name: Build, Push to GHCR, and Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/mutua-spex/file-upload-webapp:latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/mutua-spex/file-upload-webapp:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for image
        run: echo "Image pushed"

      - name: Deploy to remote via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /srv/chatapp || mkdir -p /srv/chatapp && cd /srv/chatapp
            # pull updated image
            docker pull ghcr.io/mutua-spex/file-upload-webapp:latest
            # ensure certs and webroot directories exist
            mkdir -p certs webroot data
            # write .env file from secrets
            cat > .env <<'EOF'
            CHATAPP_SECRET_KEY=${{ secrets.CHATAPP_SECRET_KEY }}
            DATABASE_URL=sqlite:////data/chatapp.db
            DOMAIN=${{ secrets.DOMAIN }}
            EOF
            # bring up services
            docker compose -f /srv/chatapp/docker-compose.prod.yml up -d --remove-orphans
            # run alembic migrations inside backend container
            docker compose -f /srv/chatapp/docker-compose.prod.yml exec -T backend /bin/sh -c "cd backend && . .venv/bin/activate 2>/dev/null || true; alembic upgrade head"
